<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominic Hardy — Geospatial Portfolio</title>
  <meta name="description" content="Geospatial portfolio: an interactive map of projects I have worked on.">
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Dominic Hardy</h1>
      <p class="tagline">Geospatial Data Analyst & Engineer · Spatial Data · Cloud-Native Geospatia · Web Mapping</p>
    </div>
    <nav>
      <a href="https://github.com/H4rdy12" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/dominic-hardy-a77a7a1b7" target="_blank" rel="noopener">LinkedIn</a>
      <!-- <a href="mailto:you@example.com">Email</a> -->
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-intro">
        <h2>Projects</h2>
        <p>Pins show where I did the work. Open a project to see the data it covered.</p>
        <div class="map-key">
          <span><i class="key-dot"></i>Work</span>
          <span><i class="key-dot key-conference"></i>Conference</span>
        </div>
        <label for="tool-filter" class="filter-label">Filter by tool</label>
        <select id="tool-filter">
          <option value="">All tools</option>
        </select>
      </div>
      <ul id="project-list" class="project-list" aria-label="Project list"></ul>
    </aside>

    <div id="map" class="map" role="region" aria-label="Map of projects"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
